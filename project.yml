name: LLM Understander
options:
  bundleIdPrefix: com.amalmehta
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  LLM Understander:
    type: application
    platform: macOS
    sources:
      - path: LLMUnderstander
    settings:
      base:
        PRODUCT_NAME: LLM Understander
        PRODUCT_MODULE_NAME: LLMUnderstander
        PRODUCT_BUNDLE_IDENTIFIER: com.amalmehta.LLMUnderstander
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LLM Understander
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_OPTIMIZATION_LEVEL: -O
        OTHER_SWIFT_FLAGS: -enforce-exclusivity=unchecked
  Engine Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: LLM Understander
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amalmehta.LLMUnderstanderTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LLM Understander.app/Contents/MacOS/LLM Understander"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  LLM Understander:
    build:
      targets:
        LLM Understander: all
        Engine Tests: [test]
    test:
      targets:
        - Engine Tests
