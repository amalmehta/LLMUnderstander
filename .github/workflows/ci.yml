name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: Website tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  engine:
    name: Mac engine tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      # UI tests need a logged-in screen session, so they run locally (see docs/INSTRUCTIONS.md).
      - run: >
          xcodebuild test -project "LLM Understander.xcodeproj" -scheme "LLM Understander"
          -only-testing:"Engine Tests" -destination "platform=macOS" -derivedDataPath build/ci -quiet
